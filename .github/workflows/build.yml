name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld zip
      - name: Build from source and test
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/HoI4ModNavigator.exe
            dist/HoI4ModNavigator-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-binary
          path: dist/windows-tests.exe
          if-no-files-found: error
  windows-tests:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-test-binary
      - name: Run Windows filesystem and menu tests
        shell: pwsh
        run: |
          .\windows-tests.exe '-test.v'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, windows-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets
      - name: Create a draft prerelease for manual review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* --verify-tag --draft --prerelease --title "HoI4 Mod Navigator $TAG" --notes "Preview build. Windows automated tests passed; review Explorer integration manually before publishing. Unsigned executable. See README for installation and rollback."
